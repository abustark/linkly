<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Linkly Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Manrope, system-ui, -apple-system, sans-serif;
            background: radial-gradient(900px 480px at 100% -12%, var(--bg-2), transparent 70%), var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: var(--s3) var(--s5) var(--s6); }

        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s3); margin: var(--s3) 0 var(--s4); }
        .stat {
            background: var(--bg); border-radius: var(--r-lg);
            padding: var(--s4);
        }
        .stat .k { color: var(--muted); font-size: 0.76rem; font-weight: 600; }
        .stat .v { margin-top: var(--s2); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; }

        .panel {
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--r-lg); padding: var(--s5);
        }
        .controls { display: grid; grid-template-columns: 1fr; gap: var(--s3); margin-bottom: var(--s4); }
        .search {
            border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; font: inherit; font-size: 1rem;
            width: 100%; background: var(--bg); color: var(--text); min-height: var(--tap);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        [data-theme="dark"] .search { background: #0c1322; }
        .search::placeholder { color: var(--muted); }
        .search:focus { outline: none; border-color: var(--brand); background: var(--card); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
        .chip {
            border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--card); color: var(--muted);
            padding: 9px 15px; font: inherit; font-weight: 600; cursor: pointer; transition: 0.15s ease; min-height: var(--tap);
        }
        .chip:hover { border-color: var(--brand); }
        .chip.active { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; border-color: transparent; }
        .toolbar-row { display: flex; gap: var(--s3); align-items: center; }
        .toolbar-row .btn { flex: 0 0 auto; }

        .status { color: var(--muted); font-size: 0.86rem; margin-bottom: var(--s3); }

        /* Link cards (mobile-first; table on desktop) */
        .links-cards { display: grid; gap: var(--s3); }
        .link-card {
            border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4);
            background: var(--card); display: flex; flex-direction: column; gap: var(--s3);
            animation: cardIn 0.3s ease both; transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .link-card:hover { border-color: var(--brand); box-shadow: 0 4px 16px -8px rgba(37, 99, 235, 0.18); }
        @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .link-card { animation: none; } }
        .link-card .lc-top { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
        .link-card .lc-short { color: var(--brand); font-weight: 700; text-decoration: none; font-size: 1.02rem; word-break: break-all; }
        .link-card .lc-orig { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .link-card .lc-meta { display: flex; align-items: center; gap: var(--s3); color: var(--muted); font-size: 0.82rem; }
        .link-card .clicks-pill {
            display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--brand);
            background: var(--brand-soft); padding: 3px 10px; border-radius: var(--r-pill); white-space: nowrap;
        }
        .link-card .lc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
        .link-card .lc-actions .btn { width: 100%; }
        .link-card .lc-actions .btn.del { grid-column: 1 / -1; }

        .table-wrap { display: none; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; background: var(--card); }
        th, td { padding: 13px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
        th { font-size: 0.73rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
        th.actions-col, td.actions-col { text-align: center; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--brand-soft); }
        td .o {
            max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted);
            cursor: pointer; transition: color 0.15s ease;
        }
        td .o:hover { color: var(--brand); }
        .date { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
        .row-actions { display: flex; gap: var(--s2); flex-wrap: nowrap; justify-content: center; }
        .row-actions .tiny { padding: 0 12px; min-height: 38px; font-size: 0.85rem; }

        .pager { display: flex; align-items: center; justify-content: center; gap: var(--s3); margin-top: var(--s4); }
        .pager .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info { font-size: 0.86rem; color: var(--muted); font-weight: 600; }

        .spark { margin-top: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s4); }
        .spark-top { display: flex; justify-content: space-between; margin-bottom: var(--s3); font-size: 0.88rem; font-weight: 600; }
        svg { width: 100%; height: 84px; display: block; border-radius: var(--r-sm); background: var(--bg); }
        .empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 0.9rem; }

        #qrcode-container { display: inline-block; background: #fff; padding: var(--s3); border-radius: var(--r-sm); border: 1px solid var(--line); }

        footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: var(--s5) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom, 0px)); line-height: 1.6; }

        @media (min-width: 760px) {
            .stats { grid-template-columns: repeat(4, 1fr); }
            .controls { grid-template-columns: 1fr auto auto; align-items: center; }
            .panel { padding: var(--s6); }
            .links-cards { display: none; }
            .table-wrap { display: block; }
        }
        @media (max-width: 759px) {
            .wrap { padding-left: var(--s4); padding-right: var(--s4); }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <div class="brand"><span class="logo">L</span> Linkly</div>
            <div class="topbar-actions">
                <button id="dashboardHomeBtn" class="btn desktop-only" type="button">Home</button>
                <label class="theme-switch" title="Toggle dark mode">
                    <input id="themeToggle" type="checkbox" aria-label="Toggle dark mode">
                    <span class="slider"></span>
                </label>
                <button id="avatarBtn" class="avatar" type="button" aria-label="Account menu"></button>
            </div>
        </div>

        <section class="stats">
            <div class="stat"><div class="k">Total Links</div><div id="totalLinks" class="v">0</div></div>
            <div class="stat"><div class="k">Total Clicks</div><div id="totalClicks" class="v">0</div></div>
            <div class="stat"><div class="k">Top Link</div><div id="topClicks" class="v">0</div></div>
            <div class="stat"><div class="k">Filtered</div><div id="filteredLinks" class="v">0</div></div>
        </section>

        <section class="panel">
            <div class="controls">
                <input id="searchInput" class="search" placeholder="Search by URL or short code">
                <div class="toolbar-row">
                    <div class="chips">
                        <button class="chip active" data-filter="all" type="button">All</button>
                        <button class="chip" data-filter="7d" type="button">7d</button>
                        <button class="chip" data-filter="30d" type="button">30d</button>
                    </div>
                    <button id="refreshBtn" class="btn" type="button">Refresh</button>
                </div>
            </div>
            <div id="statusRow" class="status">Loading links...</div>

            <div class="links-cards" id="linksCards"></div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Short URL</th>
                            <th>Original URL</th>
                            <th>Clicks</th>
                            <th>Created</th>
                            <th class="actions-col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="linksTbody"></tbody>
                </table>
            </div>

            <div class="pager">
                <button id="prevPage" class="btn tiny" type="button">← Prev</button>
                <span id="pageInfo" class="page-info">Page 1</span>
                <button id="nextPage" class="btn tiny" type="button">Next →</button>
            </div>

            <div class="spark">
                <div class="spark-top"><span>Clicks Trend (Latest 12 Links)</span><span id="sparkSummary">No data</span></div>
                <svg id="sparkline" viewBox="0 0 360 84" preserveAspectRatio="none"></svg>
            </div>
        </section>

        <footer>
            © <span id="year">2025</span> Basith. All rights reserved.<br>
            Linkly is under active development.
        </footer>
    </div>

    <div id="qrModal" class="modal">
        <div class="modal-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <strong>QR Code</strong>
                <button id="closeModalBtn" class="btn tiny" type="button">Close</button>
            </div>
            <div id="qrcode-container"></div>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">Confirm</div>
            <p class="modal-text" id="confirmMsg"></p>
            <div class="modal-actions">
                <button id="confirmCancel" class="btn tiny" type="button">Cancel</button>
                <button id="confirmOk" class="btn tiny btn-danger" type="button">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="sheetBackdrop" class="sheet-backdrop"></div>
    <div id="profileSheet" class="sheet" role="dialog" aria-label="Account">
        <div class="sheet-grab"></div>
        <div class="sheet-header">
            <span class="avatar" id="sheetAvatar"></span>
            <div style="min-width:0;">
                <div class="sheet-name" id="sheetName">Guest</div>
                <div class="sheet-email" id="sheetEmail"></div>
            </div>
        </div>
        <div class="sheet-list">
            <button class="sheet-item" id="sheetHome" type="button" data-close-sheet>
                <span class="ic">⌂</span> Home
            </button>
            <button class="sheet-item" id="sheetDashboard" type="button" data-close-sheet>
                <span class="ic">▦</span> Dashboard
            </button>
            <div class="sheet-divider"></div>
            <button class="sheet-item logout" id="sheetLogout" type="button" data-close-sheet>
                <span class="ic">⏻</span> Logout
            </button>
        </div>
    </div>

    <script src="/shared.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDRuTdgt9l5KEcGNEdXadm0FXRUndPsWAE",
            authDomain: "linkly-project-43464.firebaseapp.com",
            projectId: "linkly-project-43464",
            storageBucket: "linkly-project-43464.firebasestorage.app",
            messagingSenderId: "289406240228",
            appId: "1:289406240228:web:4b7e82d2a51089e8fbf3f1",
            measurementId: "G-CPNES7BTDN"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const L = window.Linkly;
        const themeToggle = document.getElementById("themeToggle");
        const linksTbody = document.getElementById("linksTbody");
        const linksCards = document.getElementById("linksCards");
        const statusRow = document.getElementById("statusRow");
        const searchInput = document.getElementById("searchInput");
        const refreshBtn = document.getElementById("refreshBtn");
        const chips = Array.from(document.querySelectorAll(".chip"));
        const totalLinks = document.getElementById("totalLinks");
        const totalClicks = document.getElementById("totalClicks");
        const topClicks = document.getElementById("topClicks");
        const filteredLinks = document.getElementById("filteredLinks");
        const sparkline = document.getElementById("sparkline");
        const sparkSummary = document.getElementById("sparkSummary");
        const qrModal = document.getElementById("qrModal");
        const qrcodeContainer = document.getElementById("qrcode-container");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const confirmModal = document.getElementById("confirmModal");
        const confirmTitle = document.getElementById("confirmTitle");
        const confirmMsg = document.getElementById("confirmMsg");
        const confirmCancel = document.getElementById("confirmCancel");
        const confirmOk = document.getElementById("confirmOk");
        const prevPage = document.getElementById("prevPage");
        const nextPage = document.getElementById("nextPage");
        const pageInfo = document.getElementById("pageInfo");
        let pendingDeleteCode = null;
        let pendingDeleteBtn = null;

        function showToast(msg) { L.showToast(msg); }

        let allLinks = [];
        let currentFilter = "all";
        let currentPage = 1;
        let totalPages = 1;
        let accountTotal = 0;

        function daysAgo(date) {
            const d = new Date(date);
            if (Number.isNaN(d.getTime())) return 9999;
            return (Date.now() - d.getTime()) / 86400000;
        }
        function formatDate(date) {
            const d = new Date(date);
            return Number.isNaN(d.getTime()) ? "-" : d.toLocaleDateString();
        }
        function relDate(date) {
            const d = new Date(date);
            if (Number.isNaN(d.getTime())) return "-";
            const diff = (Date.now() - d.getTime()) / 86400000;
            if (diff < 1) return "Today";
            if (diff < 2) return "Yesterday";
            if (diff < 30) return `${Math.floor(diff)}d ago`;
            if (diff < 365) return `${Math.floor(diff / 30)}mo ago`;
            return `${Math.floor(diff / 365)}y ago`;
        }
        function prettyUrl(url) {
            if (!url) return "-";
            let u = url.replace(/^https?:\/\//i, "").replace(/^www\./i, "");
            if (u.length > 42) u = u.slice(0, 42) + "\u2026";
            return u;
        }

        function renderSpark(links) {
            const values = links.slice(0, 12).map((x) => Number(x.clickCount) || 0).reverse();
            if (!values.length) {
                sparkline.innerHTML = "";
                sparkSummary.textContent = "No data";
                return;
            }
            const w = 360, h = 84, p = 10;
            const max = Math.max(...values, 1);
            const step = values.length > 1 ? (w - p * 2) / (values.length - 1) : 0;
            const points = values.map((v, i) => `${p + i * step},${h - p - (v / max) * (h - p * 2)}`).join(" ");
            const area = `${p},${h - p} ${points} ${w - p},${h - p}`;
            sparkline.innerHTML = `
                <polyline points="${area}" fill="rgba(37,99,235,0.18)" stroke="none"></polyline>
                <polyline points="${points}" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"></polyline>
            `;
            sparkSummary.textContent = `Max ${max}`;
        }

        function renderStats(filtered) {
            totalLinks.textContent = String(accountTotal);
            totalClicks.textContent = String(allLinks.reduce((a, b) => a + (Number(b.clickCount) || 0), 0));
            topClicks.textContent = String(allLinks.reduce((m, x) => Math.max(m, Number(x.clickCount) || 0), 0));
            filteredLinks.textContent = String(filtered.length);
            renderSpark(allLinks);
        }

        function shortUrlOf(l) { return `${window.location.origin}/${l.shortCode}`; }

        function renderRows(links) {
            linksTbody.innerHTML = "";
            if (!links.length) {
                linksTbody.innerHTML = '<tr><td colspan="5" class="empty">No links found. Create one from the home page.</td></tr>';
                return;
            }
            links.forEach((l) => {
                const short = shortUrlOf(l);
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><a class="s" href="${short}" target="_blank" rel="noopener noreferrer">${short}</a></td>
                    <td><span class="o" title="Click to copy\u000d\u000a${l.originalUrl}" data-copy="${l.originalUrl}">${prettyUrl(l.originalUrl)}</span></td>
                    <td><span class="clicks-pill">${l.clickCount || 0}</span></td>
                    <td class="date" title="${formatDate(l.createdAt)}">${relDate(l.createdAt)}</td>
                    <td class="actions-col">
                        <div class="row-actions">
                            <button class="btn tiny copy-btn" data-url="${short}" type="button">Copy</button>
                            <button class="btn tiny qr-btn" data-url="${short}" type="button">QR</button>
                            <a class="btn tiny" href="${short}" target="_blank" rel="noopener noreferrer">Open</a>
                            <button class="btn tiny btn-danger del-btn" data-code="${l.shortCode}" type="button">Delete</button>
                        </div>
                    </td>
                `;
                linksTbody.appendChild(tr);
            });
        }

        function renderCards(links) {
            linksCards.innerHTML = "";
            if (!links.length) {
                linksCards.innerHTML = '<div class="empty">No links found. Create one from the home page.</div>';
                return;
            }
            links.forEach((l) => {
                const short = shortUrlOf(l);
                const card = document.createElement("div");
                card.className = "link-card";
                card.innerHTML = `
                    <div class="lc-top">
                        <a class="lc-short" href="${short}" target="_blank" rel="noopener noreferrer">${short}</a>
                        <span class="lc-orig" title="Click to copy\u000d\u000a${l.originalUrl}" data-copy="${l.originalUrl}">${prettyUrl(l.originalUrl)}</span>
                    </div>
                    <div class="lc-meta">
                        <span class="clicks-pill">${l.clickCount || 0} clicks</span>
                        <span class="date">${relDate(l.createdAt)}</span>
                    </div>
                    <div class="lc-actions">
                        <button class="btn copy-btn" data-url="${short}" type="button">Copy</button>
                        <button class="btn qr-btn" data-url="${short}" type="button">QR</button>
                        <button class="btn del btn-danger del-btn" data-code="${l.shortCode}" type="button">Delete</button>
                    </div>
                `;
                linksCards.appendChild(card);
            });
        }

        function applyFilters() {
            const q = searchInput.value.trim().toLowerCase();
            let list = [...allLinks];
            if (currentFilter === "7d") list = list.filter((x) => daysAgo(x.createdAt) <= 7);
            if (currentFilter === "30d") list = list.filter((x) => daysAgo(x.createdAt) <= 30);
            if (q) list = list.filter((x) => (x.originalUrl || "").toLowerCase().includes(q) || (x.shortCode || "").toLowerCase().includes(q));
            renderRows(list);
            renderCards(list);
            renderStats(list);
            statusRow.textContent = `Showing ${list.length} of ${allLinks.length} links`;
        }

        async function loadLinks(user, page = 1) {
            statusRow.textContent = "Loading links...";
            linksTbody.innerHTML = '<tr><td colspan="5" class="empty">Loading\u2026</td></tr>';
            linksCards.innerHTML = '<div class="empty">Loading\u2026</div>';
            try {
                const token = await user.getIdToken(true);
                const response = await fetch(`/api/links?page=${page}`, { headers: { Authorization: `Bearer ${token}` } });
                if (!response.ok) throw new Error(`Status ${response.status}`);
                const data = await response.json();
                allLinks = data.links || [];
                currentPage = data.page || 1;
                totalPages = data.totalPages || 1;
                accountTotal = data.total || 0;
                applyFilters();
                pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
                prevPage.disabled = currentPage <= 1;
                nextPage.disabled = currentPage >= totalPages;
            } catch (error) {
                console.error(error);
                statusRow.textContent = "Failed to load links.";
                linksTbody.innerHTML = '<tr><td colspan="5" class="empty">Could not load your links.</td></tr>';
                linksCards.innerHTML = '<div class="empty">Could not load your links.</div>';
                showToast("Failed to load links");
            }
        }

        document.body.addEventListener("click", async (e) => {
            const t = e.target;
            if (t.classList && t.classList.contains("o") && t.dataset.copy) {
                try { await navigator.clipboard.writeText(t.dataset.copy); showToast("Original URL copied"); } catch {}
                return;
            }
            if (t.classList.contains("copy-btn")) {
                await navigator.clipboard.writeText(t.dataset.url || "");
                showToast("Copied");
            }
            if (t.classList.contains("qr-btn")) {
                qrcodeContainer.innerHTML = "";
                new QRCode(qrcodeContainer, { text: t.dataset.url || "", width: 220, height: 220 });
                qrModal.classList.add("open");
            }
            if (t.classList.contains("del-btn")) {
                const code = t.dataset.code;
                if (!code) return;
                pendingDeleteCode = code;
                pendingDeleteBtn = t;
                confirmTitle.textContent = "Delete link?";
                confirmMsg.textContent = `Delete short link "${code}"? This cannot be undone.`;
                confirmModal.classList.add("open");
            }
        });

        closeModalBtn.addEventListener("click", () => qrModal.classList.remove("open"));
        qrModal.addEventListener("click", (e) => { if (e.target === qrModal) qrModal.classList.remove("open"); });

        confirmCancel.addEventListener("click", () => {
            confirmModal.classList.remove("open");
            pendingDeleteCode = null;
            pendingDeleteBtn = null;
        });
        confirmOk.addEventListener("click", async () => {
            if (!pendingDeleteCode) return;
            const code = pendingDeleteCode;
            const btn = pendingDeleteBtn;
            confirmModal.classList.remove("open");
            btn.disabled = true;
            btn.textContent = "Deleting...";
            try {
                const token = await auth.currentUser.getIdToken(true);
                const response = await fetch(`/api/links?shortCode=${code}`, { method: "DELETE", headers: { Authorization: `Bearer ${token}` } });
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || `Status ${response.status}`);
                }
                allLinks = allLinks.filter((x) => x.shortCode !== code);
                applyFilters();
                statusRow.textContent = `Deleted ${code}. Showing ${allLinks.length} links.`;
                accountTotal = Math.max(0, accountTotal - 1);
                showToast(`Deleted ${code}`);
                if (allLinks.length === 0 && currentPage > 1) {
                    await loadLinks(auth.currentUser, currentPage - 1);
                }
            } catch (error) {
                console.error(error);
                showToast(`Delete failed: ${error.message}`);
                btn.disabled = false;
                btn.textContent = "Delete";
            }
            pendingDeleteCode = null;
            pendingDeleteBtn = null;
        });

        confirmModal.addEventListener("click", (e) => { if (e.target === confirmModal) { confirmModal.classList.remove("open"); pendingDeleteCode = null; pendingDeleteBtn = null; } });

        searchInput.addEventListener("input", applyFilters);
        chips.forEach((c) => c.addEventListener("click", () => {
            chips.forEach((x) => x.classList.remove("active"));
            c.classList.add("active");
            currentFilter = c.dataset.filter;
            applyFilters();
        }));
        refreshBtn.addEventListener("click", async () => { if (auth.currentUser) await loadLinks(auth.currentUser, currentPage); });
        prevPage.addEventListener("click", async () => { if (auth.currentUser && currentPage > 1) await loadLinks(auth.currentUser, currentPage - 1); });
        nextPage.addEventListener("click", async () => { if (auth.currentUser && currentPage < totalPages) await loadLinks(auth.currentUser, currentPage + 1); });
        document.getElementById("dashboardHomeBtn").addEventListener("click", () => { window.location.href = "/"; });
        document.getElementById("sheetHome").addEventListener("click", () => { window.location.href = "/"; });
        document.getElementById("sheetDashboard").addEventListener("click", () => { window.location.href = "/dashboard.html"; });
        document.getElementById("sheetLogout").addEventListener("click", async () => { await auth.signOut(); window.location.href = "/"; });

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "/"; return; }
            L.renderAvatar(user);
            const sheetAvatar = document.getElementById("sheetAvatar");
            sheetAvatar.textContent = document.getElementById("avatarBtn").textContent;
            const sa = document.getElementById("avatarBtn").querySelector("img");
            if (sa) sheetAvatar.appendChild(sa.cloneNode(true));
            document.getElementById("sheetName").textContent = user.displayName || "Account";
            document.getElementById("sheetEmail").textContent = user.email || "";
            await loadLinks(user, 1);
        });

        const yearEl = document.getElementById("year");
        if (yearEl) yearEl.textContent = new Date().getFullYear();
    </script>
</body>
</html>

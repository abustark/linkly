<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Linkly — Short, clean links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        html, body { min-height: 100%; }
        body {
            margin: 0;
            font-family: Manrope, system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: radial-gradient(900px 480px at 50% -12%, var(--bg-2), transparent 70%), var(--bg);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: var(--s4) var(--s5) var(--s7);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .hero { text-align: center; margin: var(--s4) 0 var(--s5); }
        .hero h1 {
            margin: 0;
            font-size: clamp(1.7rem, 6.5vw, 2.4rem);
            line-height: 1.12;
            letter-spacing: -0.025em;
            font-weight: 800;
        }
        .hero h1 .grad { background: linear-gradient(135deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hero .subtitle { margin: var(--s3) auto 0; color: var(--muted); font-size: 0.98rem; max-width: 420px; line-height: 1.55; }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: var(--s5);
        }
        .field { margin-bottom: var(--s4); }
        .field.optional .field-label { color: var(--muted); font-weight: 500; }
        .field.optional .field-label span { color: var(--muted); font-weight: 400; opacity: 0.75; }
        .field.optional .input { background: var(--bg); }
        .form-actions { display: flex; }
        .submit-btn { flex: 1; height: 52px; font-size: 1.02rem; font-weight: 700; }
        .status { margin-top: var(--s3); font-size: 0.86rem; color: var(--muted); min-height: 18px; text-align: center; }

        .result {
            display: none; margin-top: var(--s4);
            border: 1px solid var(--ok-line); background: var(--ok-bg);
            border-radius: var(--r-md); padding: var(--s4);
        }
        .result-head { display: flex; align-items: center; gap: var(--s2); color: var(--ok-text); font-weight: 700; font-size: 0.92rem; }
        .result a {
            display: block; margin: var(--s2) 0 var(--s4); color: var(--brand); font-weight: 700;
            word-break: break-all; text-decoration: none; font-size: 1.02rem;
        }
        .result-actions { display: flex; gap: var(--s2); }
        .result-actions .btn { flex: 1; padding: 12px; font-size: 0.9rem; }

        .recent { margin-top: var(--s7); }
        .recent h2 { margin: 0 0 var(--s3); font-size: 0.76rem; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
        .recent-list { display: grid; gap: var(--s2); }
        .recent-item {
            display: flex; flex-direction: column; gap: var(--s1);
            border-radius: var(--r-md); padding: var(--s3) var(--s4); background: var(--bg);
            transition: background 0.15s ease;
        }
        .recent-item:hover { background: var(--brand-soft); }
        .recent-item .s {
            color: var(--brand); font-weight: 700; text-decoration: none; font-size: 0.95rem;
        }
        .recent-item .o {
            color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 0.82rem; line-height: 1.4;
        }

        footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: var(--s5) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom, 0px)); line-height: 1.6; }

        @media (min-width: 560px) {
            main { padding: var(--s5) var(--s5) var(--s7); }
            .panel { padding: var(--s6); }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo">L</span>
            Linkly
        </div>
        <div class="topbar-actions">
            <button id="dashboardHomeBtn" class="btn desktop-only" type="button">Dashboard</button>
            <label class="theme-switch" title="Toggle dark mode">
                <input id="themeToggle" type="checkbox" aria-label="Toggle dark mode">
                <span class="slider"></span>
            </label>
            <div id="gsi-button-container" class="gsi-wrap"></div>
            <button id="avatarBtn" class="avatar" style="display:none;" type="button" aria-label="Account menu"></button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Short links in <span class="grad">one tap</span></h1>
            <p class="subtitle">Paste a long URL and get a clean, shareable link. Optional alias, dark mode, and a personal dashboard.</p>
        </section>

        <section class="panel">
            <form id="shortenForm">
                <div class="field">
                    <label class="field-label" for="longUrl">Long URL</label>
                    <input class="input" id="longUrl" type="url" inputmode="url" placeholder="https://example.com/very/long/path" required>
                </div>

                <div class="field optional">
                    <label class="field-label" for="customAlias">Custom alias <span>(optional)</span></label>
                    <input class="input" id="customAlias" type="text" placeholder="my-campaign">
                </div>

                <div class="form-actions">
                    <button id="submitBtn" class="btn btn-primary submit-btn" type="submit">Shorten</button>
                </div>

                <div id="status" class="status">Ready when you are.</div>
            </form>

            <div id="result" class="result">
                <div class="result-head">✓ Short URL created</div>
                <a id="shortUrl" href="#" target="_blank" rel="noopener noreferrer"></a>
                <div class="result-actions">
                    <button id="copyBtn" class="btn" type="button">Copy</button>
                    <button id="openBtn" class="btn" type="button">Open</button>
                </div>
            </div>
        </section>

        <section class="recent">
            <h2>Recent links (this browser)</h2>
            <div id="recentList" class="recent-list"></div>
        </section>
    </main>

    <footer>
        © <span id="year">2025</span> Basith. All rights reserved.<br>
        Linkly is under active development.
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="sheetBackdrop" class="sheet-backdrop"></div>
    <div id="profileSheet" class="sheet" role="dialog" aria-label="Account">
        <div class="sheet-grab"></div>
        <div class="sheet-header">
            <span class="avatar" id="sheetAvatar"></span>
            <div style="min-width:0;">
                <div class="sheet-name" id="sheetName">Guest</div>
                <div class="sheet-email" id="sheetEmail"></div>
            </div>
        </div>
        <div class="sheet-list">
            <button class="sheet-item" id="sheetDashboard" type="button">
                <span class="ic">▦</span> Dashboard
            </button>
            <div class="sheet-divider"></div>
            <button class="sheet-item logout" id="sheetLogout" type="button" data-close-sheet>
                <span class="ic">⏻</span> Logout
            </button>
        </div>
    </div>

    <script src="/shared.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDRuTdgt9l5KEcGNEdXadm0FXRUndPsWAE",
            authDomain: "linkly-project-43464.firebaseapp.com",
            projectId: "linkly-project-43464",
            storageBucket: "linkly-project-43464.firebasestorage.app",
            messagingSenderId: "289406240228",
            appId: "1:289406240228:web:4b7e82d2a51089e8fbf3f1",
            measurementId: "G-CPNES7BTDN"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const L = window.Linkly;

        const RECENT_KEY = "linkly_recent_links";
        const gsiButtonContainer = document.getElementById("gsi-button-container");
        const avatarBtn = document.getElementById("avatarBtn");
        const shortenForm = document.getElementById("shortenForm");
        const longUrl = document.getElementById("longUrl");
        const customAlias = document.getElementById("customAlias");
        const submitBtn = document.getElementById("submitBtn");
        const statusEl = document.getElementById("status");
        const result = document.getElementById("result");
        const shortUrl = document.getElementById("shortUrl");
        const copyBtn = document.getElementById("copyBtn");
        const openBtn = document.getElementById("openBtn");
        const recentList = document.getElementById("recentList");

        document.getElementById("dashboardHomeBtn").addEventListener("click", () => { window.location.href = "/dashboard.html"; });
        document.getElementById("sheetDashboard").addEventListener("click", () => { L.closeSheet(); window.location.href = "/dashboard.html"; });
        document.getElementById("sheetLogout").addEventListener("click", async () => { await auth.signOut(); L.showToast("Signed out"); });

        function getRecent() {
            try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { return []; }
        }
        function saveRecent(items) {
            localStorage.setItem(RECENT_KEY, JSON.stringify(items.slice(0, 6)));
        }
        function renderRecent() {
            const items = getRecent();
            recentList.innerHTML = "";
            if (!items.length) {
                recentList.innerHTML = '<div class="recent-item"><span class="o">No links yet. Create one above.</span></div>';
                return;
            }
            items.forEach((it) => {
                const div = document.createElement("div");
                div.className = "recent-item";
                div.innerHTML = `<a class="s" href="${it.shortUrl}" target="_blank" rel="noopener noreferrer">${it.shortUrl}</a><span class="o" title="${it.originalUrl}">${it.originalUrl}</span>`;
                recentList.appendChild(div);
            });
        }

        async function handleCredentialResponse(response) {
            try {
                const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
                await auth.signInWithCredential(credential);
                L.showToast("Signed in");
            } catch (error) {
                console.error(error);
                statusEl.style.color = "var(--danger)";
                statusEl.textContent = "Sign in failed. Please try again.";
                L.showToast("Sign in failed");
            }
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "289406240228-dv8ugcgfhds71gclc5akg9jclpe4is8o.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(gsiButtonContainer, { theme: "outline", size: "large" });
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                gsiButtonContainer.style.display = "none";
                avatarBtn.style.display = "grid";
                L.renderAvatar(user);
                document.getElementById("sheetAvatar").textContent = avatarBtn.textContent;
                const sa = avatarBtn.querySelector("img");
                if (sa) document.getElementById("sheetAvatar").appendChild(sa.cloneNode(true));
                document.getElementById("sheetName").textContent = user.displayName || "Account";
                document.getElementById("sheetEmail").textContent = user.email || "";
            } else {
                gsiButtonContainer.style.display = "block";
                avatarBtn.style.display = "none";
                if (window.google && google.accounts) google.accounts.id.prompt();
            }
        });

        shortenForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            statusEl.style.color = "var(--muted)";
            statusEl.textContent = "Creating short URL...";
            submitBtn.disabled = true;
            result.style.display = "none";

            const headers = { "Content-Type": "application/json" };
            const user = auth.currentUser;
            if (user) {
                try { headers.Authorization = `Bearer ${await user.getIdToken(true)}`; }
                catch { statusEl.textContent = "Auth token failed"; submitBtn.disabled = false; return; }
            }

            try {
                const response = await fetch("/api/shorten", {
                    method: "POST",
                    headers,
                    body: JSON.stringify({ originalUrl: longUrl.value.trim(), customAlias: customAlias.value.trim() })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Could not shorten URL");

                shortUrl.href = data.shortUrl;
                shortUrl.textContent = data.shortUrl;
                result.style.display = "block";
                statusEl.textContent = "Done";

                const rec = getRecent().filter((x) => x.shortUrl !== data.shortUrl);
                rec.unshift({ originalUrl: data.originalUrl, shortUrl: data.shortUrl });
                saveRecent(rec);
                renderRecent();
                L.showToast("Short URL ready");
            } catch (error) {
                statusEl.style.color = "var(--danger)";
                statusEl.textContent = error.message;
                L.showToast(error.message);
            } finally {
                submitBtn.disabled = false;
            }
        });

        copyBtn.addEventListener("click", async () => {
            if (!shortUrl.textContent) return;
            await navigator.clipboard.writeText(shortUrl.textContent);
            L.showToast("Copied");
        });
        openBtn.addEventListener("click", () => {
            if (shortUrl.href) window.open(shortUrl.href, "_blank", "noopener");
        });

        renderRecent();
    </script>
</body>
</html>

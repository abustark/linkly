<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Linkly Dashboard</title>
    <meta name="description" content="Manage your links, track clicks, and download QR codes from the Linkly dashboard.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Linkly">
    <meta property="og:title" content="Linkly Dashboard">
    <meta property="og:description" content="Manage your links, track clicks, and download QR codes from the Linkly dashboard.">
    <meta property="og:url" content="https://linkly-link.vercel.app/dashboard.html">
    <meta property="og:image" content="https://linkly-link.vercel.app/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Linkly Dashboard">
    <meta name="twitter:description" content="Manage your links, track clicks, and download QR codes from the Linkly dashboard.">
    <meta name="twitter:image" content="https://linkly-link.vercel.app/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared.css">
    <link rel="stylesheet" href="/dashboard.css">
    <link rel="stylesheet" href="/m/mobile.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="wrap" id="main" tabindex="-1">
        <div class="topbar">
            <a class="brand" href="/m/" aria-label="Linkly home"><span class="logo">L</span> Linkly</a>
            <div class="topbar-actions">
                <label class="theme-switch" title="Toggle dark mode">
                    <input id="themeToggle" type="checkbox" aria-label="Toggle dark mode">
                    <span class="slider"></span>
                </label>
                <button id="avatarBtn" class="avatar" type="button" aria-label="Account menu"></button>
            </div>
        </div>

        <section class="stats">
            <div class="stat"><div class="k">Total Links</div><div id="totalLinks" class="v">0</div></div>
            <div class="stat"><div class="k">Total Clicks</div><div id="totalClicks" class="v">0</div></div>
            <div class="stat"><div class="k">Top Link</div><div id="topClicks" class="v">0</div></div>
            <div class="stat"><div class="k">Filtered</div><div id="filteredLinks" class="v">0</div></div>
        </section>

        <section class="panel">
            <div class="controls">
                <input id="searchInput" class="search" placeholder="Search by URL or short code" aria-label="Search links">
                <div class="toolbar-row">
                    <div class="chips">
                        <button class="chip active" data-filter="all" type="button">All</button>
                        <button class="chip" data-filter="7d" type="button">7d</button>
                        <button class="chip" data-filter="30d" type="button">30d</button>
                    </div>
                    <button id="refreshBtn" class="btn" type="button">Refresh</button>
                </div>
            </div>
            <div id="statusRow" class="status" role="status" aria-live="polite">Loading links...</div>

            <div class="links-cards" id="linksCards"></div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Short URL</th>
                            <th>Original URL</th>
                            <th>Clicks</th>
                            <th>Created</th>
                            <th class="actions-col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="linksTbody"></tbody>
                </table>
            </div>

            <div class="pager">
                <button id="prevPage" class="btn tiny" type="button">← Prev</button>
                <span id="pageInfo" class="page-info">Page 1</span>
                <button id="nextPage" class="btn tiny" type="button">Next →</button>
            </div>

            <div class="spark">
                <div class="spark-top"><span>Clicks Trend (Latest 12 Links)</span><span id="sparkSummary">No data</span></div>
                <svg id="sparkline" viewBox="0 0 360 84" preserveAspectRatio="none" aria-hidden="true"></svg>
            </div>
        </section>

        <footer>
            © <span id="year">2025</span> ABu. All rights reserved.<br>
            Linkly — short, clean links.
        </footer>
    </div>

    <div id="qrModal" class="modal" role="dialog" aria-modal="true" aria-label="QR Code">
        <div class="modal-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <strong>QR Code</strong>
                <button id="closeModalBtn" class="btn tiny" type="button">Close</button>
            </div>
            <div id="qrcode-container"></div>
        </div>
    </div>

    <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">Confirm</div>
            <p class="modal-text" id="confirmMsg"></p>
            <div class="modal-actions">
                <button id="confirmCancel" class="btn tiny" type="button">Cancel</button>
                <button id="confirmOk" class="btn tiny btn-danger" type="button">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="sheetBackdrop" class="sheet-backdrop"></div>
    <div id="profileSheet" class="sheet" role="dialog" aria-label="Account">
        <div class="sheet-grab"></div>
        <div class="sheet-header">
            <span class="avatar" id="sheetAvatar"></span>
            <div style="min-width:0;">
                <div class="sheet-name" id="sheetName">Guest</div>
                <div class="sheet-email" id="sheetEmail"></div>
            </div>
        </div>
        <div class="sheet-list">
            <button class="sheet-item" id="sheetHome" type="button" data-close-sheet>
                <span class="ic">⌂</span> Home
            </button>
            <button class="sheet-item" id="sheetDashboard" type="button" data-close-sheet>
                <span class="ic">▦</span> Dashboard
            </button>
            <div class="sheet-divider"></div>
            <label class="sheet-item sheet-theme" for="sheetThemeToggle">
                <span class="ic">◐</span> <span id="themeLabel">Dark mode</span>
                <span class="theme-switch">
                    <input id="sheetThemeToggle" type="checkbox" aria-label="Toggle dark mode">
                    <span class="slider"></span>
                </span>
            </label>
            <div class="sheet-divider"></div>
            <button class="sheet-item logout" id="sheetLogout" type="button" data-close-sheet>
                <span class="ic">⏻</span> Logout
            </button>
        </div>
    </div>

    <script src="/shared.js"></script>
    <script>
        window.LinklyFirebase.init();
        const auth = firebase.auth();

        const L = window.Linkly;
        const themeToggle = document.getElementById("themeToggle");
        const linksTbody = document.getElementById("linksTbody");
        const linksCards = document.getElementById("linksCards");
        const statusRow = document.getElementById("statusRow");
        const searchInput = document.getElementById("searchInput");
        const refreshBtn = document.getElementById("refreshBtn");
        const chips = Array.from(document.querySelectorAll(".chip"));
        const totalLinks = document.getElementById("totalLinks");
        const totalClicks = document.getElementById("totalClicks");
        const topClicks = document.getElementById("topClicks");
        const filteredLinks = document.getElementById("filteredLinks");
        const sparkline = document.getElementById("sparkline");
        const sparkSummary = document.getElementById("sparkSummary");
        const qrModal = document.getElementById("qrModal");
        const qrcodeContainer = document.getElementById("qrcode-container");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const confirmModal = document.getElementById("confirmModal");
        const confirmTitle = document.getElementById("confirmTitle");
        const confirmMsg = document.getElementById("confirmMsg");
        const confirmCancel = document.getElementById("confirmCancel");
        const confirmOk = document.getElementById("confirmOk");
        const prevPage = document.getElementById("prevPage");
        const nextPage = document.getElementById("nextPage");
        const pageInfo = document.getElementById("pageInfo");
        let pendingDeleteCode = null;
        let pendingDeleteBtn = null;
        let lastFocused = null;

        function showToast(msg) { L.showToast(msg); }

        function getFocusables(el) {
            return Array.from(el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
        }
        function openModal(el) {
            lastFocused = document.activeElement;
            el.classList.add("open");
            const focusables = getFocusables(el);
            if (focusables.length) focusables[0].focus();
        }
        function closeModal(el) {
            el.classList.remove("open");
            if (lastFocused && lastFocused.focus) lastFocused.focus();
            lastFocused = null;
        }

        let allLinks = [];
        let currentFilter = "all";
        let currentPage = 1;
        let totalPages = 1;
        let accountTotal = 0;
        let accountTotalClicks = 0;
        let accountTopClicks = 0;
        let searchTimer = null;

        function formatDate(date) {
            const d = new Date(date);
            return Number.isNaN(d.getTime()) ? "-" : d.toLocaleDateString();
        }
        function relDate(date) {
            const d = new Date(date);
            if (Number.isNaN(d.getTime())) return "-";
            const diff = (Date.now() - d.getTime()) / 86400000;
            if (diff < 1) return "Today";
            if (diff < 2) return "Yesterday";
            if (diff < 30) return `${Math.floor(diff)}d ago`;
            if (diff < 365) return `${Math.floor(diff / 30)}mo ago`;
            return `${Math.floor(diff / 365)}y ago`;
        }
        function prettyUrl(url) {
            if (!url) return "-";
            let u = url.replace(/^https?:\/\//i, "").replace(/^www\./i, "");
            if (u.length > 42) u = u.slice(0, 42) + "\u2026";
            return u;
        }

        function renderSpark(links) {
            const values = links.slice(0, 12).map((x) => Number(x.clickCount) || 0).reverse();
            if (!values.length) {
                sparkline.innerHTML = "";
                sparkSummary.textContent = "No data";
                return;
            }
            const w = 360, h = 84, p = 10;
            const max = Math.max(...values, 1);
            const step = values.length > 1 ? (w - p * 2) / (values.length - 1) : 0;
            const points = values.map((v, i) => `${p + i * step},${h - p - (v / max) * (h - p * 2)}`).join(" ");
            const area = `${p},${h - p} ${points} ${w - p},${h - p}`;
            sparkline.innerHTML = `
                <polyline points="${area}" fill="rgba(37,99,235,0.18)" stroke="none"></polyline>
                <polyline points="${points}" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"></polyline>
            `;
            sparkSummary.textContent = `Max ${max}`;
        }

        function renderStats(count) {
            totalLinks.textContent = String(accountTotal);
            totalClicks.textContent = String(accountTotalClicks);
            topClicks.textContent = String(accountTopClicks);
            filteredLinks.textContent = String(count);
            renderSpark(allLinks);
        }

        function shortUrlOf(l) { return `${window.location.origin}/${l.shortCode}`; }

        function renderRows(links) {
            linksTbody.innerHTML = "";
            if (!links.length) {
                linksTbody.innerHTML = '<tr><td colspan="5" class="empty">No links found. Create one from the home page.</td></tr>';
                return;
            }
            const esc = L.escapeHtml;
            links.forEach((l) => {
                const short = esc(shortUrlOf(l));
                const orig = esc(l.originalUrl);
                const origPretty = esc(prettyUrl(l.originalUrl));
                const code = esc(l.shortCode);
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><a class="s" href="${short}" target="_blank" rel="noopener noreferrer">${short}</a></td>
                    <td><span class="o" title="Click to copy\u000d\u000a${orig}" data-copy="${orig}">${origPretty}</span></td>
                    <td><span class="clicks-pill">${l.clickCount || 0}</span></td>
                    <td class="date" title="${formatDate(l.createdAt)}">${relDate(l.createdAt)}</td>
                    <td class="actions-col">
                        <div class="row-actions">
                            <button class="btn tiny copy-btn" data-url="${short}" type="button">Copy</button>
                            <button class="btn tiny qr-btn" data-url="${short}" type="button">QR</button>
                            <a class="btn tiny" href="${short}" target="_blank" rel="noopener noreferrer">Open</a>
                            <button class="btn tiny btn-danger del-btn" data-code="${code}" type="button">Delete</button>
                        </div>
                    </td>
                `;
                linksTbody.appendChild(tr);
            });
        }

        function renderCards(links) {
            linksCards.innerHTML = "";
            if (!links.length) {
                linksCards.innerHTML = '<div class="empty">No links found. Create one from the home page.</div>';
                return;
            }
            const esc = L.escapeHtml;
            links.forEach((l) => {
                const short = esc(shortUrlOf(l));
                const orig = esc(l.originalUrl);
                const origPretty = esc(prettyUrl(l.originalUrl));
                const code = esc(l.shortCode);
                const card = document.createElement("div");
                card.className = "link-card";
                card.innerHTML = `
                    <div class="lc-top">
                        <a class="lc-short" href="${short}" target="_blank" rel="noopener noreferrer">${short}</a>
                        <span class="lc-orig" title="Click to copy\u000d\u000a${orig}" data-copy="${orig}">${origPretty}</span>
                    </div>
                    <div class="lc-meta">
                        <span class="clicks-pill">${l.clickCount || 0} clicks</span>
                        <span class="date">${relDate(l.createdAt)}</span>
                    </div>
                    <div class="lc-actions">
                        <button class="btn copy-btn" data-url="${short}" type="button">Copy</button>
                        <button class="btn qr-btn" data-url="${short}" type="button">QR</button>
                        <button class="btn del btn-danger del-btn" data-code="${code}" type="button">Delete</button>
                    </div>
                `;
                linksCards.appendChild(card);
            });
        }

        function renderAll(list) {
            renderRows(list);
            renderCards(list);
            renderStats(list.length);
        }

        async function loadLinks(user, page = 1) {
            statusRow.textContent = "Loading links...";
            linksTbody.innerHTML = '<tr><td colspan="5" class="empty">Loading\u2026</td></tr>';
            linksCards.innerHTML = '<div class="empty">Loading\u2026</div>';
            try {
                const token = await user.getIdToken(true);
                const params = new URLSearchParams({ page: String(page) });
                const q = searchInput.value.trim();
                if (q) params.set("q", q);
                if (currentFilter !== "all") params.set("range", currentFilter);
                const response = await fetch(`/api/links?${params.toString()}`, { headers: { Authorization: `Bearer ${token}` } });
                if (!response.ok) throw new Error(`Status ${response.status}`);
                const data = await response.json();
                allLinks = data.links || [];
                currentPage = data.page || 1;
                totalPages = data.totalPages || 1;
                accountTotal = data.total || 0;
                accountTotalClicks = data.accountTotalClicks || 0;
                accountTopClicks = data.accountTopClicks || 0;
                renderAll(allLinks);
                statusRow.textContent = `Showing ${allLinks.length} of ${accountTotal} links`;
                pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
                prevPage.disabled = currentPage <= 1;
                nextPage.disabled = currentPage >= totalPages;
            } catch (error) {
                console.error(error);
                statusRow.textContent = "Failed to load links.";
                linksTbody.innerHTML = '<tr><td colspan="5" class="empty">Could not load your links.</td></tr>';
                linksCards.innerHTML = '<div class="empty">Could not load your links.</div>';
                showToast("Failed to load links");
            }
        }

        document.body.addEventListener("click", async (e) => {
            const t = e.target;
            if (t.classList && t.classList.contains("o") && t.dataset.copy) {
                try { await navigator.clipboard.writeText(t.dataset.copy); showToast("Original URL copied"); } catch {}
                return;
            }
            if (t.classList.contains("copy-btn")) {
                await navigator.clipboard.writeText(t.dataset.url || "");
                showToast("Copied");
            }
            if (t.classList.contains("qr-btn")) {
                qrcodeContainer.innerHTML = "";
                new QRCode(qrcodeContainer, { text: t.dataset.url || "", width: 220, height: 220 });
                openModal(qrModal);
            }
            if (t.classList.contains("del-btn")) {
                const code = t.dataset.code;
                if (!code) return;
                pendingDeleteCode = code;
                pendingDeleteBtn = t;
                confirmTitle.textContent = "Delete link?";
                confirmMsg.textContent = `Delete short link "${code}"? This cannot be undone.`;
                openModal(confirmModal);
            }
        });

        closeModalBtn.addEventListener("click", () => closeModal(qrModal));
        qrModal.addEventListener("click", (e) => { if (e.target === qrModal) closeModal(qrModal); });

        confirmCancel.addEventListener("click", () => {
            closeModal(confirmModal);
            pendingDeleteCode = null;
            pendingDeleteBtn = null;
        });
        confirmOk.addEventListener("click", async () => {
            if (!pendingDeleteCode) return;
            const code = pendingDeleteCode;
            const btn = pendingDeleteBtn;
            closeModal(confirmModal);
            btn.disabled = true;
            btn.textContent = "Deleting...";
            try {
                const token = await auth.currentUser.getIdToken(true);
                const response = await fetch(`/api/links?shortCode=${code}`, { method: "DELETE", headers: { Authorization: `Bearer ${token}` } });
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || `Status ${response.status}`);
                }
                allLinks = allLinks.filter((x) => x.shortCode !== code);
                accountTotal = Math.max(0, accountTotal - 1);
                showToast(`Deleted ${code}`);
                const targetPage = allLinks.length === 0 && currentPage > 1 ? currentPage - 1 : currentPage;
                await loadLinks(auth.currentUser, targetPage);
                statusRow.textContent = `Deleted ${code}.`;
            } catch (error) {
                console.error(error);
                showToast(`Delete failed: ${error.message}`);
                btn.disabled = false;
                btn.textContent = "Delete";
            }
            pendingDeleteCode = null;
            pendingDeleteBtn = null;
        });

        confirmModal.addEventListener("click", (e) => { if (e.target === confirmModal) { closeModal(confirmModal); pendingDeleteCode = null; pendingDeleteBtn = null; } });

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { if (auth.currentUser) loadLinks(auth.currentUser, 1); }, 300);
        });
        chips.forEach((c) => c.addEventListener("click", () => {
            chips.forEach((x) => x.classList.remove("active"));
            c.classList.add("active");
            currentFilter = c.dataset.filter;
            if (auth.currentUser) loadLinks(auth.currentUser, 1);
        }));
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeModal(qrModal);
                closeModal(confirmModal);
                pendingDeleteCode = null;
                pendingDeleteBtn = null;
                return;
            }
            if (e.key === "Tab") {
                const open = qrModal.classList.contains("open") ? qrModal
                    : confirmModal.classList.contains("open") ? confirmModal : null;
                if (!open) return;
                const focusables = getFocusables(open);
                if (!focusables.length) return;
                const first = focusables[0];
                const last = focusables[focusables.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });
        refreshBtn.addEventListener("click", async () => { if (auth.currentUser) await loadLinks(auth.currentUser, currentPage); });
        prevPage.addEventListener("click", async () => { if (auth.currentUser && currentPage > 1) await loadLinks(auth.currentUser, currentPage - 1); });
        nextPage.addEventListener("click", async () => { if (auth.currentUser && currentPage < totalPages) await loadLinks(auth.currentUser, currentPage + 1); });
        document.getElementById("sheetHome").addEventListener("click", () => { window.location.href = "/m/"; });
        document.getElementById("sheetDashboard").addEventListener("click", () => { window.location.href = "/m/dashboard.html"; });
        document.getElementById("sheetLogout").addEventListener("click", async () => { await auth.signOut(); window.location.href = "/m/"; });

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "/m/"; return; }
            L.renderAvatar(user);
            const sheetAvatar = document.getElementById("sheetAvatar");
            sheetAvatar.textContent = document.getElementById("avatarBtn").textContent;
            const sa = document.getElementById("avatarBtn").querySelector("img");
            if (sa) sheetAvatar.appendChild(sa.cloneNode(true));
            document.getElementById("sheetName").textContent = user.displayName || "Account";
            document.getElementById("sheetEmail").textContent = user.email || "";
            await loadLinks(user, 1);
        });

        const yearEl = document.getElementById("year");
        if (yearEl) yearEl.textContent = new Date().getFullYear();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7fb">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found — Linkly</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --bg: #f4f7fb;
            --fg: #0f172a;
            --muted: #64748b;
            --card: #ffffff;
            --brand: #2563eb;
            --brand-2: #7c3aed;
            --ring: rgba(37, 99, 235, 0.25);
        }
        [data-theme="dark"] {
            --bg: #0a0f1c;
            --fg: #e6edf7;
            --muted: #94a3b8;
            --card: #111a2e;
            --brand: #3b82f6;
            --brand-2: #a78bfa;
            --ring: rgba(59, 130, 246, 0.35);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            text-align: center;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
        }
        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            font-weight: 800;
            font-size: 26px;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
        }
        h1 {
            margin: 0 0 6px;
            font-size: 64px;
            line-height: 1;
            font-weight: 800;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
        p { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.6; }
        a.btn {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            outline: none;
        }
        a.btn:focus-visible { box-shadow: 0 0 0 3px var(--ring); }
        a.btn:hover { filter: brightness(1.06); }
        footer { margin-top: 26px; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo" aria-hidden="true">L</div>
        <h1>404</h1>
        <div class="sub">This page doesn't exist</div>
        <p>But great links never expire. Head back home and shorten something worth sharing.</p>
        <a class="btn" href="/">Back to Linkly</a>
        <footer>© <span id="year">2026</span> ABu — Linkly, short and clean.</footer>
    </main>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('linkly_theme');
                if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
            var y = document.getElementById('year');
            if (y) y.textContent = new Date().getFullYear();
        })();
    </script>
</body>
</html>
